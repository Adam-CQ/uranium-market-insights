pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    upstream backend { server api:8000; }
    server {
        listen 8080;
        root /usr/share/nginx/html;
        client_max_body_size 1k;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        # ECharts uses inline style attributes for positioning its SVG/tooltips.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        location /api/ { proxy_pass http://backend; proxy_connect_timeout 5s; proxy_read_timeout 15s; }
        location = /health { proxy_pass http://backend; }
        location = /ready { proxy_pass http://backend; }
        location /assets/ { try_files $uri =404; }
        location ~ /\. { deny all; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
